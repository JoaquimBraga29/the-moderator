<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Moderator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#313338;--bg2:#2b2d31;--bg3:#1e1f22;--hover:#2e3035;--line:#3f4147;
  --text:#dbdee1;--head:#f2f3f5;--muted:#949ba4;--link:#00a8fc;
  --blurple:#5865f2;--green:#23a55a;--red:#da373c;--yellow:#f0b232;
  --ban:#da373c;--mute:#e67e22;--warn:#f0b232;--allow:#23a55a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:"Noto Sans","gg sans","Segoe UI",Helvetica,Arial,sans-serif;min-height:100%;font-size:15px}
body{min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:0 0 40px}
.host .wrap{max-width:1180px}
/* channel header */
.hdr{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:var(--bg);border-bottom:1px solid var(--bg3);box-shadow:0 1px 0 rgba(0,0,0,.2);padding:10px 16px;min-height:52px}
.srv{width:32px;height:32px;border-radius:12px;background:var(--blurple);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.ch{font-weight:700;color:var(--head);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .hash{color:var(--muted);font-weight:500;margin-right:4px;font-size:20px}
.ch small{color:var(--muted);font-weight:500;font-size:13px;margin-left:8px;border-left:1px solid var(--line);padding-left:8px}
.hr{margin-left:auto;display:flex;align-items:center;gap:8px}
.timer{background:var(--red);color:#fff;border-radius:12px;padding:3px 11px;font-weight:700;font-size:14px;white-space:nowrap}
.timer.calm{background:var(--blurple)}
.host .timer{font-size:22px;padding:6px 16px;border-radius:18px}
.bar{height:3px;background:var(--bg3)}
.bar>i{display:block;height:100%;background:var(--blurple);transition:width .25s linear}
.bar.low>i{background:var(--red)}
.body{padding:14px 16px}
/* embeds */
.card{background:var(--bg2);border-left:4px solid var(--blurple);border-radius:4px;padding:14px 16px;margin-bottom:14px}
.card.green{border-left-color:var(--green)}.card.red{border-left-color:var(--red)}.card.yellow{border-left-color:var(--yellow)}
h2{font-size:16px;color:var(--head);margin-bottom:8px;font-weight:700}
p{line-height:1.45}
.muted{color:var(--muted)}
.sys{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:14px;padding:6px 0 10px}
.sys b{color:var(--head)}
/* inputs & buttons */
input{width:100%;padding:12px;border-radius:4px;border:none;background:var(--bg3);color:var(--text);font-size:16px;outline:none;font-family:inherit}
input:focus{box-shadow:0 0 0 2px var(--blurple)}
label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:8px;letter-spacing:.3px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:4px;font-weight:600;font-size:15px;padding:11px 16px;color:#fff;background:var(--blurple);transition:background .15s}
button:hover{background:#4752c4}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:#4e5058}button.ghost:hover{background:#6d6f78}
button.danger{background:var(--red)}button.danger:hover{background:#a12828}
button.success{background:var(--green)}button.success:hover{background:#1a7f45}
.full{width:100%;margin-top:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row button{flex:1}
/* role pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:12px;padding:2px 8px;border-radius:4px;background:var(--bg3);margin-right:6px;white-space:nowrap}
.p-BAN{color:#ff6b6e}.p-BAN:before{background:var(--ban)}
.p-MUTE{color:#ffa45c}.p-MUTE:before{background:var(--mute)}
.p-WARN{color:#ffd166}.p-WARN:before{background:var(--warn)}
.p-ALLOW{color:#4fdc8a}.p-ALLOW:before{background:var(--allow)}
.rules{list-style:none;margin-top:6px}
.rules li{margin:9px 0;line-height:1.45}
/* chat messages */
.msg{display:flex;gap:14px;padding:10px 4px;border-radius:4px}
.msg:hover{background:var(--hover)}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:16px}
.av.sm{width:28px;height:28px;font-size:12px}
.mb{flex:1;min-width:0}
.mn{font-weight:600;font-size:15px}
.mn small{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.text{font-size:15.5px;color:var(--text);margin:2px 0 8px;line-height:1.4;word-wrap:break-word}
.host .text{font-size:19px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.acts button{font-size:12px;padding:7px 2px;white-space:nowrap;background:var(--bg2);border:1px solid var(--line);color:var(--text);font-weight:600}
.acts button:hover{background:#383a40}
.acts button.on.a-BAN{background:var(--ban);border-color:var(--ban);color:#fff}
.acts button.on.a-MUTE{background:var(--mute);border-color:var(--mute);color:#fff}
.acts button.on.a-WARN{background:var(--warn);border-color:var(--warn);color:#1e1f22}
.acts button.on.a-ALLOW{background:var(--allow);border-color:var(--allow);color:#fff}
.reply{border-left:2px solid var(--line);margin:6px 0 2px;padding:2px 0 2px 10px;font-size:13.5px;color:var(--muted)}
.ok{color:#4fdc8a;font-weight:700}.bad{color:#ff6b6e;font-weight:700}
.divider{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:600;margin:12px 0}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
.divider.red{color:#ff6b6e}.divider.red:before,.divider.red:after{background:var(--red)}
.big{font-size:34px;font-weight:800;color:var(--head);margin:4px 0}
/* member list & ranking */
.members{list-style:none}
.members li{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:4px;font-weight:500;color:var(--text)}
.members li:hover{background:var(--hover)}
.members li.off{opacity:.35}
.members .st{width:10px;height:10px;border-radius:50%;background:var(--green);margin-left:auto}
.members li.wait .st{background:var(--muted)}
.members .tick{margin-left:auto;color:#4fdc8a;font-weight:700;font-size:13px}
.rank{list-style:none}
.rank li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:4px;margin-bottom:4px;background:var(--bg3);font-weight:600}
.rank li.me{box-shadow:inset 0 0 0 2px var(--blurple)}
.rank .pos{width:26px;text-align:center;color:var(--muted);font-weight:800}
.rank .pts{margin-left:auto;color:var(--head)}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
#qr{background:#fff;padding:12px;border-radius:8px;display:inline-block}
.center{text-align:center}
.status{position:fixed;bottom:8px;right:10px;font-size:11px;color:var(--muted);background:var(--bg3);padding:3px 8px;border-radius:10px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:5px}
.dot.on{background:var(--green)}
</style>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="wrap" id="app"><div class="hdr"><div class="srv">TM</div><div class="ch"><span class="hash">#</span>the-moderator</div></div><div class="body"><p class="muted">Connecting…</p></div></div>
<div class="status"><span class="dot" id="dot"></span><span id="stxt">offline</span></div>
<script>
"use strict";
const ROUNDS = [
  [ {t:"gg ez, you guys are trash", a:"WARN", w:"Trash talk: toxic, but it doesn't attack anyone's identity."},
    {t:"Girls shouldn't play ranked, go back to the kitchen", a:"MUTE", w:"Sexism: attacks her for being a woman."},
    {t:"I found your Instagram. I know which school you go to.", a:"BAN", w:"Stalking and a threat: online gender-based violence."},
    {t:"Nice job, Ana! Carry us!", a:"ALLOW", w:"Positive, friendly chat."} ],
  [ {t:"Send me private pics or I'll leak your real name", a:"BAN", w:"Sextortion: blackmail with intimate images."},
    {t:"Omg a girl on the team, we're gonna lose", a:"MUTE", w:"Sexism: judges her skill by her gender."},
    {t:"Stop doing that, noob", a:"WARN", w:"Rude, but common toxicity."},
    {t:"I reported a player for harassing me, please check the replay", a:"ALLOW", w:"A report: never punish someone asking for help."} ],
  [ {t:"Turn on your mic, girl, I want to hear your sexy voice", a:"BAN", w:"Sexual harassment."},
    {t:"You only got that rank because some guy played for you", a:"MUTE", w:"Sexism: denies her skill because she is a woman."},
    {t:"U all are so stupid", a:"WARN", w:"Generic insult: toxic, not identity-based."},
    {t:"Anyone want to duo later? I play support", a:"ALLOW", w:"Normal game chat."} ],
  [ {t:"I'll wait for you outside the gaming café on Rua Chile tonight", a:"BAN", w:"A real-world threat: the violence leaves the screen."},
    {t:"Women can't aim, it's science", a:"MUTE", w:"Sexism disguised as a 'fact'."},
    {t:"Uninstall the game, please", a:"WARN", w:"Trash talk."},
    {t:"Thanks for the tips, coach! I learned a lot today", a:"ALLOW", w:"Positive chat."} ],
  [ {t:"Her address is Av. Sete, 123. Go say hi.", a:"BAN", w:"Doxing: publishing someone's private information."},
    {t:"Female streamers only get views because of their looks", a:"MUTE", w:"Sexism against women who gain visibility."},
    {t:"Bro, you're so bad lol", a:"WARN", w:"Common toxicity."},
    {t:"Our team has a female coach this season. Let's go!", a:"ALLOW", w:"Positive chat."} ],
  [ {t:"I have your photos. Pay me or everyone will see them.", a:"BAN", w:"Sextortion."},
    {t:"Shut up, nobody asked a girl about strategy", a:"MUTE", w:"Sexism that tries to silence her."},
    {t:"This team is hopeless", a:"WARN", w:"Negative and toxic, but not identity-based."},
    {t:"Women in esports deserve the same prize money", a:"ALLOW", w:"An opinion: freedom of expression."} ],
  [ {t:"Every time you stream, I'll be there. You can't block me forever.", a:"BAN", w:"Stalking."},
    {t:"Make me a sandwich and then we can talk", a:"MUTE", w:"Sexist stereotype."},
    {t:"You're useless, delete your account", a:"WARN", w:"Generic insult."},
    {t:"Is anyone else lagging? The server seems slow", a:"ALLOW", w:"Normal game chat."} ],
  [ {t:"Keep talking and I'll post your phone number on Discord", a:"BAN", w:"A doxing threat."},
    {t:"Girls only play games for attention", a:"MUTE", w:"Sexism."},
    {t:"You're so slow, learn to play", a:"WARN", w:"Common toxicity."},
    {t:"Someone is threatening my teammate, mods please help!", a:"ALLOW", w:"A report: never punish someone asking for help."} ]
];
const USERS = ["xXSniperXx","n00bSlayer","ShadowFox","Ana_GG","LagMaster","PixelQueen","TryHard99","CoachLu","DarkByte","NightOwl","GGWP_Br","Viper77"];
const ACTIONS = ["BAN","MUTE","WARN","ALLOW"];
const ROUND_MS = 60000, GRACE = 1500, MAX = 1000, NEXT_MS = 3000;
const PTS = {4:1000, 3:500, 2:500, 1:250, 0:0};

/* ---------------- SETUP ---------------- */
const qs = new URLSearchParams(location.search);
const IS_HOST = qs.has("host");
const ROOM = (qs.get("room") || "ifba").toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 24) || "ifba";
const T = "the-moderator-x7q2/" + ROOM + "/";
const BROKER = qs.get("b") === "emqx" ? "wss://broker.emqx.io:8084/mqtt" : "wss://broker.hivemq.com:8884/mqtt";
const app = document.getElementById("app");
if (IS_HOST) document.body.classList.add("host");

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const ls = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const scoreFor = n => PTS[n] ?? 0;

let client = null, connected = false;
function connect(onMsg){
  if (!window.mqtt) { app.innerHTML = '<div class="body"><div class="card red"><p>Could not load the game. Check your internet connection and reload.</p></div></div>'; return; }
  client = mqtt.connect(BROKER, { clientId: "tm_" + rid(), clean: true, reconnectPeriod: 2000, connectTimeout: 10000, keepalive: 30 });
  client.on("connect", () => { connected = true; setStatus(); client.subscribe(IS_HOST ? [T + "join", T + "answer"] : [T + "state"], { qos: 1 }); onConnect && onConnect(); });
  client.on("close", () => { connected = false; setStatus(); });
  client.on("offline", () => { connected = false; setStatus(); });
  client.on("message", (topic, payload, packet) => { let d; try { d = JSON.parse(payload.toString()); } catch(e){ return; } onMsg(topic.slice(T.length), d, packet); });
}
let onConnect = null;
function setStatus(){ document.getElementById("dot").className = "dot" + (connected ? " on" : ""); document.getElementById("stxt").textContent = connected ? "online" : "reconnecting…"; }
function pub(sub, data, retain){ if (client) client.publish(T + sub, JSON.stringify(data), { qos: 1, retain: !!retain }); }

/* ---------------- UI HELPERS (Discord look) ---------------- */
const ICON = { BAN: "🔨", MUTE: "🔇", WARN: "⚠️", ALLOW: "✅" };
const AV_BG = ["#ed4245","#23a55a","#5865f2","#f0b232","#eb459e","#3ba5d8","#e67e22","#9b59b6"];
const NAME_C = ["#f47b67","#57f287","#a5b4fc","#fee75c","#f78fc6","#7dd3fc","#ffb86b","#d0a8ff"];
const hueOf = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 8; };
const avatar = (name, sm) => `<div class="av${sm ? " sm" : ""}" style="background:${AV_BG[hueOf(name)]}">${esc((String(name).trim()[0] || "?").toUpperCase())}</div>`;
const nameColor = name => NAME_C[hueOf(name)];
const clock = (offsetMin) => { const d = new Date(Date.now() - (offsetMin || 0) * 60000); return "Today at " + d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0"); };
const header = (channel, sub, right) => `<div class="hdr"><div class="srv">TM</div><div class="ch"><span class="hash">#</span>${channel}${sub ? `<small>${sub}</small>` : ""}</div><div class="hr">${right || ""}</div></div>`;
const medal = i => ["🥇","🥈","🥉"][i] || (i + 1);

const RULES_HTML = `
  <h2>📜 Como jogar</h2>
  <p class="muted">Você é o moderador de um jogo online. Cada rodada mostra 4 mensagens do chat. Dê uma ação para cada mensagem: cada ação é usada <b>uma única vez</b> por rodada.</p>
  <ul class="rules">
    <li><span class="pill p-BAN">🔨 BAN</span>Ameaça, perseguição, doxing (expor dados pessoais), chantagem com imagens íntimas ou assédio sexual.</li>
    <li><span class="pill p-MUTE">🔇 MUTE</span>Ofensa machista: atacar alguém por ser mulher.</li>
    <li><span class="pill p-WARN">⚠️ WARN</span>Toxicidade comum: xingamentos, trash talk, comentários grosseiros.</li>
    <li><span class="pill p-ALLOW">✅ ALLOW</span>Conversa normal, opiniões, denúncias e pedidos de ajuda.</li>
  </ul>
  <p class="muted" style="margin-top:10px">8 rodadas · 60 segundos cada · aperte <b>DONE</b> antes do tempo acabar ou você zera a rodada.</p>
  <p class="muted" style="margin-top:6px">4 acertos = 1000 pts · 2 acertos = 500 · 1 acerto = 250 · 0 acertos = 0</p>`;

function rankList(players, meId){
  const sorted = players.slice().sort((a,b) => b.total - a.total || a.time - b.time);
  if (!sorted.length) return '<p class="muted">No players.</p>';
  return '<ol class="rank">' + sorted.map((p,i) =>
    `<li class="${p.id === meId ? "me" : ""}"><span class="pos">${medal(i)}</span>${avatar(p.name, true)}<span style="color:${nameColor(p.name)}">${esc(p.name)}${p.id === meId ? ' <span class="muted">(you)</span>' : ""}</span><span class="pts">${p.total} pts</span></li>`).join("") + "</ol>";
}
function chatMsg(user, text, inner, k){
  return `<div class="msg">${avatar(user)}<div class="mb"><div class="mn" style="color:${nameColor(user)}">${esc(user)}<small>${clock(3 - k)}</small></div><div class="text">${esc(text)}</div>${inner || ""}</div></div>`;
}

/* =========================================================
   HOST
   ========================================================= */
if (IS_HOST) {
  let S = null;
  try { S = JSON.parse(ls.get("tm_host_" + ROOM) || "null"); } catch(e) { S = null; }
  if (!S || !S.players) S = { gameId: rid(), kickId: rid(), phase: "lobby", round: 0, deadline: 0, roundStart: 0, order: [], users: [], players: {}, answers: {} };
  const save = () => ls.set("tm_host_" + ROOM, JSON.stringify(S));
  const playerUrl = location.origin + location.pathname + (ROOM !== "ifba" ? "?room=" + ROOM : "");
  const active = p => Date.now() - (p.lastSeen || 0) < 15000;

  function publicState(){
    const players = Object.entries(S.players).map(([id,p]) => ({ id, name: p.name, total: p.total, time: p.time || 0 }));
    const st = { gameId: S.gameId, kickId: S.kickId, phase: S.phase, round: S.round, deadline: S.deadline, now: Date.now(),
      order: S.order, users: S.users, players, answered: Object.keys(S.answers), nextAt: S.nextAt || 0 };
    if (S.phase === "reveal" || S.phase === "final") st.results = S.answers;
    return st;
  }
  function publish(){ save(); pub("state", publicState(), true); render(); }

  function onMsg(sub, d){
    if (!d || typeof d.id !== "string") return;
    if (sub === "join") {
      const name = String(d.name || "").trim().slice(0, 20); if (!name) return;
      if (d.kickId !== S.kickId) return;
      const p = S.players[d.id];
      if (!p) { S.players[d.id] = { name, total: 0, time: 0, lastSeen: Date.now() }; publish(); }
      else { const changed = p.name !== name; p.name = name; p.lastSeen = Date.now(); if (changed) publish(); else render(); }
    } else if (sub === "answer") {
      if (S.phase !== "round" || d.gameId !== S.gameId || d.round !== S.round) return;
      const p = S.players[d.id]; if (!p || S.answers[d.id]) return;
      const now = Date.now(); p.lastSeen = now;
      const late = now > S.deadline + GRACE;
      const set = ROUNDS[S.round - 1];
      let correct = 0; const picks = {};
      for (let i = 0; i < 4; i++) { const a = d.answers && d.answers[i]; picks[i] = ACTIONS.includes(a) ? a : null; if (picks[i] === set[i].a) correct++; }
      const pts = late ? 0 : scoreFor(correct);
      S.answers[d.id] = { pts, correct, late };
      p.total += pts; p.time = (p.time || 0) + Math.min(now - S.roundStart, ROUND_MS);
      const act = Object.entries(S.players).filter(([,q]) => active(q));
      if (act.length && act.every(([id]) => S.answers[id])) endRound(); else publish();
    }
  }

  function startRound(){
    S.phase = "round"; S.order = shuffle([0,1,2,3]); S.users = shuffle(USERS).slice(0,4);
    S.answers = {}; S.roundStart = Date.now(); S.deadline = S.roundStart + ROUND_MS; publish();
  }
  function endRound(){
    for (const id of Object.keys(S.players)) if (!S.answers[id]) S.answers[id] = { pts: 0, correct: 0, missed: true };
    S.phase = "reveal"; publish();
  }
  function startGame(){ for (const p of Object.values(S.players)) { p.total = 0; p.time = 0; } S.gameId = rid(); S.round = 1; startRound(); }
  function next(){ if (S.round < ROUNDS.length) { S.round++; startRound(); } else { S.phase = "final"; publish(); } }
  function endMatch(){ if (!confirm("End the match now and show the final ranking?")) return; S.phase = "final"; S.nextAt = 0; publish(); }
  function newMatch(){ for (const p of Object.values(S.players)) { p.total = 0; p.time = 0; } S.gameId = rid(); S.phase = "lobby"; S.round = 0; S.answers = {}; publish(); }
  function closeRoom(){ if (!confirm("Remove everyone from the room?")) return; S = { gameId: rid(), kickId: rid(), phase: "lobby", round: 0, deadline: 0, roundStart: 0, order: [], users: [], players: {}, answers: {} }; publish(); }

  setInterval(() => {
    if (S.phase === "round") { updateTimer(S.deadline); if (Date.now() > S.deadline + GRACE) endRound(); }
  }, 250);
  setInterval(() => { if (connected) pub("state", publicState(), true); if (S.phase === "lobby") render(); }, 4000);

  function render(){
    const ps = Object.entries(S.players);
    let h = "";
    if (S.phase === "lobby") {
      const act = ps.filter(([,p]) => active(p));
      h += header("lobby", "host · room " + esc(ROOM), `<span class="timer calm">👥 ${act.length} online</span>`) + '<div class="body">';
      h += `<div class="grid2"><div>
          <div class="card center"><h2>📱 Scan to join</h2><div id="qr"></div><p class="muted" style="margin-top:10px;word-break:break-all;font-size:13px">${esc(playerUrl)}</p></div>
          <div class="card yellow">${RULES_HTML}</div></div>
        <div><div class="card green"><h2>Online — ${act.length}</h2>
          <ul class="members">${ps.length ? ps.map(([,p]) => `<li class="${active(p) ? "" : "off"}">${avatar(p.name, true)}<span style="color:${nameColor(p.name)}">${esc(p.name)}</span><span class="st"></span></li>`).join("") : '<li class="muted">Waiting for players…</li>'}</ul>
          <button class="full success" id="start" ${act.length ? "" : "disabled"}>▶ Start match</button>
          ${ps.length ? '<button class="full ghost" id="close">Remove everyone</button>' : ""}</div></div></div>`;
    } else if (S.phase === "round") {
      const set = ROUNDS[S.round - 1];
      const actN = ps.filter(([,p]) => active(p)).length;
      h += header("ranked-lobby", `round ${S.round}/${ROUNDS.length}`, '<span class="timer" id="timer">⏱ 60s</span>') + '<div class="bar"><i id="tbar"></i></div><div class="body">';
      h += `<div class="grid2"><div><div class="sys">🛡️ <span>Moderators are reviewing these messages…</span></div>
          ${S.order.map((i,k) => chatMsg(S.users[k] || "player", set[i].t, "", k)).join("")}</div>
        <div><div class="card"><h2>Answered — ${Object.keys(S.answers).length} / ${actN}</h2>
          <ul class="members">${ps.map(([id,p]) => `<li class="${S.answers[id] ? "" : "wait"}">${avatar(p.name, true)}<span style="color:${nameColor(p.name)}">${esc(p.name)}</span>${S.answers[id] ? '<span class="tick">✔ done</span>' : '<span class="st"></span>'}</li>`).join("")}</ul>
          <button class="full ghost" id="end">End round now</button><button class="full danger" id="endmatch">End match</button></div></div></div>`;
    } else if (S.phase === "reveal") {
      const set = ROUNDS[S.round - 1];
      const perfect = Object.values(S.answers).filter(a => a.correct === 4 && !a.late).length;
      h += header("ranked-lobby", `round ${S.round}/${ROUNDS.length} · answers`, `<span class="timer calm">⭐ ${perfect} perfect</span>`) + '<div class="body">';
      h += `<div class="grid2"><div>
          ${S.order.map((i,k) => chatMsg(S.users[k] || "player", set[i].t, `<span class="pill p-${set[i].a}">${ICON[set[i].a]} ${set[i].a}</span><div class="reply">🛡️ ${esc(set[i].w)}</div>`, k)).join("")}</div>
        <div><div class="card"><h2>🏆 Ranking</h2>${rankList(publicState().players)}
          <button class="full" id="next">${S.round < ROUNDS.length ? "Next round ▸" : "Final ranking 🏆"}</button><button class="full danger" id="endmatch">End match</button></div></div></div>`;
    } else if (S.phase === "final") {
      h += header("results", "final ranking") + '<div class="body">';
      h += `<div class="card yellow" style="max-width:640px;margin:0 auto 14px"><div class="big center">🏆 FINAL RANKING</div>${rankList(publicState().players)}
        <div class="row" style="margin-top:14px"><button class="success" id="again">New match</button><button class="danger" id="close">Remove everyone</button></div></div>`;
    }
    h += "</div>";
    app.innerHTML = h;
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
    on("start", startGame); on("close", closeRoom); on("end", endRound); on("next", next); on("again", newMatch); on("endmatch", endMatch);
    const qr = document.getElementById("qr");
    if (qr && window.QRCode) new QRCode(qr, { text: playerUrl, width: 220, height: 220 });
    if (S.phase === "round") updateTimer(S.deadline);
  }
  onConnect = () => publish();
  connect(onMsg);
  render();
}

/* =========================================================
   PLAYER
   ========================================================= */
else {
  let myId = ls.get("tm_id"); if (!myId) { myId = rid(); ls.set("tm_id", myId); }
  let myName = ls.get("tm_name") || "";
  let joined = false, myKick = null, st = null, offset = 0, kickedMsg = "";
  let sel = {}, selKey = "", sentKey = null, lastRenderKey = "";

  function onMsg(sub, d, packet){
    if (sub !== "state" || !d || !d.gameId) return;
    if (!packet.retain && typeof d.now === "number") offset = d.now - Date.now();
    st = d;
    if (!joined) return;
    if (joined && myKick && d.kickId !== myKick) { joined = false; myKick = null; kickedMsg = "The host closed the room. Enter your name to join again."; }
    const key = d.gameId + ":" + d.round;
    if (key !== selKey) { selKey = key; sel = {}; }
    const rk = [joined, d.phase, d.gameId, d.round, (d.answered || []).includes(myId), d.players.length, d.players.map(p => p.name + p.total).join("|")].join("/");
    if (rk !== lastRenderKey || d.phase === "lobby") render();
  }
  function join(){
    const inp = document.getElementById("name");
    const n = (inp ? inp.value : myName).trim().slice(0, 20);
    if (!n) { inp && inp.focus(); return; }
    myName = n; ls.set("tm_name", n); joined = true; kickedMsg = "";
    myKick = st ? st.kickId : null;
    if (st) { const key = st.gameId + ":" + st.round; if (key !== selKey) { selKey = key; sel = {}; } }
    pub("join", { id: myId, name: myName, kickId: myKick });
    render();
  }
  setInterval(() => {
    if (!joined || !connected) return;
    if (!myKick && st) myKick = st.kickId;
    pub("join", { id: myId, name: myName, kickId: myKick });
  }, 5000);
  setInterval(() => { if (!st || !joined) return; if (st.phase === "round") { updateTimer(st.deadline - offset); updateDone(); } }, 250);

  function timeLeft(){ return st ? (st.deadline - offset) - Date.now() : 0; }
  function updateDone(){
    const b = document.getElementById("done"); if (!b) return;
    const full = Object.keys(sel).length === 4;
    const left = timeLeft();
    b.disabled = !full || left <= 0;
    b.textContent = left <= 0 ? "Time's up · 0 points" : full ? "DONE ✔" : `DONE (${Object.keys(sel).length}/4)`;
  }
  function pick(i, a){
    if (timeLeft() <= 0) return;
    for (const k of Object.keys(sel)) if (sel[k] === a && +k !== i) delete sel[k];
    sel[i] = a; render(true);
  }
  function done(){
    if (Object.keys(sel).length !== 4 || timeLeft() <= 0) return;
    sentKey = selKey;
    pub("answer", { id: myId, gameId: st.gameId, round: st.round, answers: sel });
    render(true);
  }

  function render(){
    let h = "";
    if (!joined) {
      h += header("the-moderator") + `<div class="body">
        <div class="card center" style="margin-top:20px;border-left:none;padding:28px 20px">
          <div class="srv" style="width:72px;height:72px;border-radius:24px;font-size:24px;margin:0 auto 14px">TM</div>
          <h2 style="font-size:22px">The Moderator</h2>
          <p class="muted" style="margin-bottom:18px">You've been invited to join a server</p>
          ${kickedMsg ? `<p class="bad" style="margin-bottom:12px;font-weight:600">${esc(kickedMsg)}</p>` : ""}
          <div style="text-align:left"><label for="name">Your name</label>
          <input id="name" maxlength="20" placeholder="Enter your name" value="${esc(myName)}" autocomplete="off"></div>
          <button class="full" id="join">Join</button></div></div>`;
      lastRenderKey = "";
    } else if (!st) {
      h += header("the-moderator") + '<div class="body"><div class="sys">⏳ <span>Connecting to the room…</span></div></div>';
    } else {
      const me = st.players.find(p => p.id === myId);
      const answered = (st.answered || []).includes(myId) || sentKey === selKey;
      if (st.phase === "lobby") {
        h += header("lobby", `${st.players.length} online`) + '<div class="body">';
        h += `<div class="sys">➡️ <span><b>${esc(myName)}</b> entrou no servidor. Bem-vindo(a)! 👋</span></div>
          <div class="card yellow">${RULES_HTML}</div>
          <div class="divider">aguardando o host iniciar a partida</div>
          <ul class="members">${st.players.map(p => `<li>${avatar(p.name, true)}<span style="color:${nameColor(p.name)}">${esc(p.name)}${p.id === myId ? ' <span class="muted">(você)</span>' : ""}</span><span class="st"></span></li>`).join("")}</ul>`;
      } else if (st.phase === "round") {
        const set = ROUNDS[st.round - 1];
        h += header("ranked-lobby", `round ${st.round}/${ROUNDS.length}`, '<span class="timer" id="timer"></span>') + '<div class="bar"><i id="tbar"></i></div><div class="body">';
        if (answered) {
          h += `<div class="card green center"><div class="big">✔</div><p>Answer sent! Waiting for the other moderators…</p></div>`;
        } else {
          h += `<div class="sys">🛡️ <span>You are the moderator. Use each action <b>once</b>.</span></div>`;
          h += st.order.map((i,k) => chatMsg((st.users || [])[k] || "player", set[i].t,
            `<div class="acts">${ACTIONS.map(a => `<button class="a-${a} ${sel[i] === a ? "on" : ""}" data-i="${i}" data-a="${a}">${ICON[a]} ${a}</button>`).join("")}</div>`, k)).join("");
          h += `<button class="full" id="done">DONE</button>`;
        }
      } else if (st.phase === "reveal" || st.phase === "final") {
        const set = ROUNDS[st.round - 1];
        const r = (st.results || {})[myId];
        if (st.phase === "reveal") {
          h += header("ranked-lobby", `round ${st.round}/${ROUNDS.length} · answers`) + '<div class="body">';
          const good = r && !r.missed && !r.late && r.pts > 0;
          h += `<div class="card ${good ? "green" : "red"} center"><div class="big">+${r ? r.pts : 0}</div>
            <p class="muted">${!r || r.missed ? "No answer this round." : r.late ? "Too late: 0 points." : r.correct + " of 4 correct"}</p>
            <p style="margin-top:6px">Total: <b>${me ? me.total : 0} pts</b></p></div>`;
          h += st.order.map((i,k) => { const mine = sel[i]; const ok = mine === set[i].a;
            return chatMsg((st.users || [])[k] || "player", set[i].t,
              `<span class="pill p-${set[i].a}">${ICON[set[i].a]} ${set[i].a}</span>${mine ? `<span class="${ok ? "ok" : "bad"}">${ok ? "✔ correct" : "✘ you: " + mine}</span>` : ""}<div class="reply">🛡️ ${esc(set[i].w)}</div>`, k); }).join("");
          h += '<div class="divider">waiting for the host</div>';
        } else {
          const sorted = st.players.slice().sort((a,b) => b.total - a.total || a.time - b.time);
          const pos = sorted.findIndex(p => p.id === myId) + 1;
          h += header("results", "game over") + '<div class="body">';
          h += `<div class="card yellow center"><div class="big">${pos ? medal(pos - 1) : "🏁"}</div><p>${pos ? `You finished <b>#${pos}</b> with <b>${me.total} pts</b>` : "Game over"}</p></div>
            <div class="card"><h2>🏆 Final ranking</h2>${rankList(st.players, myId)}</div>`;
        }
      }
      h += "</div>";
      lastRenderKey = [joined, st.phase, st.gameId, st.round, answered, st.players.length, st.players.map(p => p.name + p.total).join("|")].join("/");
    }
    app.innerHTML = h;
    const j = document.getElementById("join"); if (j) j.onclick = join;
    const n = document.getElementById("name"); if (n) n.onkeydown = e => { if (e.key === "Enter") join(); };
    const d = document.getElementById("done"); if (d) d.onclick = done;
    app.querySelectorAll(".acts button").forEach(b => b.onclick = () => pick(+b.dataset.i, b.dataset.a));
    if (st && st.phase === "round" && joined) { updateTimer(st.deadline - offset); updateDone(); }
  }
  connect(onMsg);
  render();
}

/* ---------------- shared timer ---------------- */
function updateNext(at){
  const el = document.getElementById("nextc"); if (!el) return;
  const secs = Math.max(0, Math.ceil((at - Date.now()) / 1000));
  el.textContent = secs > 0 ? "next in " + secs + "…" : "starting…";
}
function updateTimer(deadline){
  const el = document.getElementById("timer"), bar = document.getElementById("tbar");
  const left = Math.max(0, deadline - Date.now());
  if (el) { el.textContent = "⏱ " + Math.ceil(left / 1000) + "s"; el.className = "timer" + (left < 10000 ? "" : " calm"); }
  if (bar) { bar.style.width = (left / ROUND_MS * 100) + "%"; bar.parentNode.className = "bar" + (left < 10000 ? " low" : ""); }
}
</script>
</body>
</html>
